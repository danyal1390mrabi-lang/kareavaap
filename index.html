<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>دانلود اپ کاراوا</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);
      color:#fff;padding:24px
    }
    .card{
      width:min(520px,100%);text-align:center;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);
      border-radius:28px;padding:38px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)
    }
    .logo{width:110px;height:110px;object-fit:contain;border-radius:24px;margin-bottom:18px}
    h1{margin:0 0 12px;font-size:30px}
    p{line-height:2;color:#dbeafe;margin:10px 0}
    .download{
      display:block;margin:28px auto 14px;padding:17px 24px;border-radius:16px;
      background:#22c55e;color:#fff;text-decoration:none;font-size:19px;font-weight:700;
      box-shadow:0 10px 25px rgba(34,197,94,.25);transition:.2s
    }
    .download:hover{transform:translateY(-2px);background:#16a34a}
    .note{font-size:13px;color:#cbd5e1}
    .features{margin:22px 0 0;padding:0;list-style:none;text-align:right}
    .features li{padding:9px 0;color:#e2e8f0}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo-icon-1024.png" alt="لوگوی کاراوا">
    <h1>اپلیکیشن کاراوا</h1>
    <p>نسخه اندروید کاراوا را مستقیم دانلود و روی گوشی خود نصب کنید.</p>

    <a class="download" href="Kareava.apk" download>
      ⬇️ دانلود مستقیم APK کاراوا
    </a>

    <div class="note">پس از دانلود، فایل Kareava.apk را باز کنید و نصب را انجام دهید.</div>

    <ul class="features">
      <li>✓ دسترسی سریع به سایت کاراوا</li>
      <li>✓ بدون نیاز به استخراج فایل ZIP</li>
      <li>✓ دریافت مستقیم فایل APK</li>
    </ul>
  </main>
</body>
</html>
